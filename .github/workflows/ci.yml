name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ReviewAI.slnx

      - name: Build
        run: dotnet build ReviewAI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ReviewAI.slnx --configuration Release --no-build
